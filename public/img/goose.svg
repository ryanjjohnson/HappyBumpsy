<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <!-- Canada goose, facing right, mid-honk. Wings are animated by the game's stylesheet (.goose-wing). -->
  <!-- legs -->
  <path d="M84 118 L80 146 M76 146 L92 146" stroke="#1d1d1d" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M104 120 L102 146 M96 146 L112 146" stroke="#1d1d1d" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- body -->
  <path d="M30 96 C 30 70, 60 60, 100 62 C 135 64, 150 80, 146 100 C 140 122, 100 130, 70 124 C 46 120, 30 112, 30 96 Z" fill="#6f5a41"/>
  <path d="M60 118 C 90 130, 130 122, 146 100 C 132 118, 96 124, 60 118 Z" fill="#f2ece0"/>
  <path d="M120 70 C 138 74, 150 86, 146 100 C 140 88, 128 80, 116 76 Z" fill="#d9c9ab"/>
  <!-- tail -->
  <path d="M30 96 L 8 84 L 14 100 L 6 108 L 34 106 Z" fill="#2a2a2a"/>
  <!-- wing -->
  <g class="goose-wing">
    <path d="M60 78 C 80 60, 120 60, 138 74 C 120 78, 100 92, 70 100 C 60 96, 56 88, 60 78 Z" fill="#4e3f2d"/>
    <path d="M70 100 C 96 92, 118 80, 138 74 C 128 92, 104 104, 76 106 Z" fill="#3b3024"/>
  </g>
  <!-- neck + head -->
  <path d="M138 78 C 150 60, 152 36, 162 26" stroke="#141414" stroke-width="16" stroke-linecap="round" fill="none"/>
  <ellipse cx="170" cy="22" rx="16" ry="12" fill="#141414"/>
  <path d="M160 24 C 166 34, 178 34, 182 24 C 176 30, 166 30, 160 24 Z" fill="#f4f1ea"/>
  <path d="M184 20 L 200 26 L 184 30 Z" fill="#1a1a1a"/>
  <circle cx="171" cy="19" r="2.2" fill="#fff"/>
  <circle cx="171.6" cy="19" r="1.2" fill="#000"/>
</svg>
