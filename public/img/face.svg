<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- HappyBumpsy: the laughing-crying emoji, with a mouthful of bad decisions -->
  <defs>
    <radialGradient id="hb-skin" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffec7a"/>
      <stop offset="0.5" stop-color="#fdc93a"/>
      <stop offset="1" stop-color="#e2900a"/>
    </radialGradient>
    <linearGradient id="hb-tear" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#a9e4ff"/>
      <stop offset="1" stop-color="#2b86dc"/>
    </linearGradient>
    <clipPath id="hb-mouth-clip">
      <path d="M40 116 C 60 130, 140 130, 160 116 C 158 176, 130 190, 100 190 C 70 190, 42 176, 40 116 Z"/>
    </clipPath>
  </defs>

  <!-- face -->
  <circle cx="100" cy="100" r="97" fill="url(#hb-skin)" stroke="#cf7d00" stroke-width="2"/>

  <!-- eyebrows -->
  <path d="M42 68 C 54 50, 76 50, 88 60" fill="none" stroke="#7a4300" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M112 60 C 124 50, 146 50, 158 68" fill="none" stroke="#7a4300" stroke-width="5.5" stroke-linecap="round"/>

  <!-- squeezed-shut laughing eyes -->
  <path d="M40 92 C 52 74, 76 74, 88 92" fill="none" stroke="#4a2600" stroke-width="7" stroke-linecap="round"/>
  <path d="M112 92 C 124 74, 148 74, 160 92" fill="none" stroke="#4a2600" stroke-width="7" stroke-linecap="round"/>

  <!-- tears -->
  <path d="M34 92 C 26 112, 6 128, 12 146 C 16 158, 34 160, 42 148 C 50 136, 40 118, 34 92 Z" fill="url(#hb-tear)" stroke="#1f6fb8" stroke-width="1.5"/>
  <ellipse cx="22" cy="146" rx="4.5" ry="7" fill="#fff" opacity=".7" transform="rotate(-25 22 146)"/>
  <path d="M166 92 C 174 112, 194 128, 188 146 C 184 158, 166 160, 158 148 C 150 136, 160 118, 166 92 Z" fill="url(#hb-tear)" stroke="#1f6fb8" stroke-width="1.5"/>
  <ellipse cx="178" cy="146" rx="4.5" ry="7" fill="#fff" opacity=".7" transform="rotate(25 178 146)"/>

  <!-- mouth -->
  <path d="M40 116 C 60 130, 140 130, 160 116 C 158 176, 130 190, 100 190 C 70 190, 42 176, 40 116 Z" fill="#2a0707" stroke="#7a2e10" stroke-width="2"/>
  <g clip-path="url(#hb-mouth-clip)">
    <!-- gums -->
    <path d="M36 110 C 60 134, 140 134, 164 110 L 164 140 C 140 150, 60 150, 36 140 Z" fill="#b5342e"/>
    <path d="M36 172 C 70 160, 130 160, 164 172 L 164 200 L 36 200 Z" fill="#a52d2a"/>
    <!-- throat -->
    <ellipse cx="100" cy="156" rx="54" ry="16" fill="#180303"/>
    <!-- upper teeth, hanging -->
    <g fill="#d9c79c" stroke="#8a7248" stroke-width="1.2">
      <rect x="50" y="126" width="13" height="20" rx="3" transform="rotate(8 56 136)"/>
      <rect x="66" y="128" width="12" height="24" rx="3" transform="rotate(-6 72 140)"/>
      <rect x="84" y="130" width="11" height="17" rx="3" fill="#c9b17f"/>
      <rect x="104" y="129" width="14" height="26" rx="3" transform="rotate(5 111 142)"/>
      <rect x="124" y="128" width="11" height="18" rx="3" transform="rotate(-9 129 137)" fill="#bfa672"/>
      <rect x="140" y="126" width="12" height="16" rx="3" transform="rotate(12 146 134)"/>
    </g>
    <!-- lower teeth, rising -->
    <g fill="#cfbb8e" stroke="#7d6740" stroke-width="1.2">
      <rect x="58" y="158" width="12" height="20" rx="3" transform="rotate(-10 64 168)"/>
      <rect x="76" y="156" width="14" height="22" rx="3" transform="rotate(4 83 167)" fill="#bfa672"/>
      <rect x="98" y="160" width="10" height="16" rx="3" transform="rotate(-5 103 168)"/>
      <rect x="114" y="155" width="13" height="24" rx="3" transform="rotate(9 120 167)"/>
      <rect x="134" y="158" width="11" height="18" rx="3" transform="rotate(-7 139 167)" fill="#c9b17f"/>
    </g>
    <!-- rot -->
    <g fill="#5a3a1a" opacity=".75">
      <circle cx="70" cy="134" r="2.5"/><circle cx="109" cy="140" r="3"/><circle cx="145" cy="132" r="2"/>
      <circle cx="82" cy="170" r="2.5"/><circle cx="119" cy="164" r="2"/><circle cx="60" cy="166" r="1.8"/>
    </g>
  </g>
</svg>
